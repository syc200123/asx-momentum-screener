name: ASX Momentum Scan

on:
  schedule:
    # 8:00 PM UTC = 6:00 AM AEST (next day) on weekdays
    - cron: '0 20 * * 0-4'
  workflow_dispatch:
    inputs:
      skip_scan:
        description: 'Skip scan, use existing data (for testing digest changes)'
        required: false
        default: 'false'
        type: boolean
      min_price:
        description: 'Minimum stock price filter for digest'
        required: false
        default: '0.50'
      min_mcap:
        description: 'Minimum market cap in millions for digest'
        required: false
        default: '100'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install yfinance requests pandas numpy

      # ── Step 1: Full ASX Scan ──────────────────────────────────
      - name: Run ASX momentum scan
        if: ${{ github.event.inputs.skip_scan != 'true' }}
        env:
          MIN_PRICE: "0.10"
          DOWNLOAD_BATCH: "200"
          FETCH_INFO: "true"
          OUTPUT_DIR: "docs/data"
        run: python scripts/scan.py

      # ── Step 2: Generate full markdown digest (committed to repo) ──
      - name: Generate markdown digest
        env:
          SCAN_OUTPUT: "docs/data/asx_momentum_data.json"
          MIN_PRICE: ${{ github.event.inputs.min_price || '0.50' }}
          MIN_MCAP: ${{ github.event.inputs.min_mcap || '100' }}
          MIN_VOLUME: "50000"
          MAX_MOMENTUM: "30"
          MAX_REVERSAL: "20"
          OUTPUT_FILE: "docs/data/momentum_digest.md"
          FORMAT: "markdown"
        run: python scripts/momentum_digest.py

      # ── Step 3: Post concise summary to Slack ──────────────────
      - name: Post summary to Slack
        env:
          SCAN_OUTPUT: "docs/data/asx_momentum_data.json"
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          MIN_PRICE: ${{ github.event.inputs.min_price || '0.50' }}
          MIN_MCAP: ${{ github.event.inputs.min_mcap || '100' }}
          MIN_VOLUME: "50000"
          FORMAT: "slack"
          PAGES_URL: ${{ vars.PAGES_URL || '' }}
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            python scripts/momentum_digest.py
          else
            echo "No SLACK_WEBHOOK_MOMENTUM secret set — skipping"
          fi

      # ── Step 4: Send structured prompt to Claude via Slack ─────
      # Claude picks this up and runs skills:
      #   - Momentum candidates → fundamental check via web search
      #   - Reversal candidates → Reversal Signal Detector skill
      - name: Trigger Claude analysis via Slack
        env:
          SCAN_OUTPUT: "docs/data/asx_momentum_data.json"
          SLACK_WEBHOOK_CLAUDE: ${{ secrets.SLACK_WEBHOOK_URL }}
          MIN_PRICE: ${{ github.event.inputs.min_price || '0.50' }}
          MIN_MCAP: ${{ github.event.inputs.min_mcap || '100' }}
          MIN_VOLUME: "50000"
          FORMAT: "claude"
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            python scripts/momentum_digest.py
          else
            echo "No SLACK_WEBHOOK_CLAUDE secret set — skipping"
          fi

      # ── Step 5: Commit updated data ────────────────────────────
      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            TIMESTAMP=$(date -u +"%d %b %Y %H:%M UTC")
            STOCK_COUNT=$(python3 -c "import json; d=json.load(open('docs/data/asx_momentum_data.json')); print(d['summary']['passed'])" 2>/dev/null || echo "?")
            git commit -m "Scan: ${STOCK_COUNT} stocks — ${TIMESTAMP}"
            git push
          fi